name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, and it installs nothing but pytest. Every number in the README
  # (the staleness table, the silence percentages, and the indistinguishability
  # proof that leads it) comes from code importing only the standard library. A
  # repository about a system that cannot reach the network should be able to
  # prove its own claims without reaching one. If that stops being true this
  # job goes red, which is the signal rather than an inconvenience.
  measurement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      # Actions are pinned to a full commit SHA, because a tag can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pytest only
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=8,<10"

      # Three of these tests exist because of defects they caught: a component
      # that could not go stale, a withdrawn claim about clock drift, and an
      # assessor view that contained the answer key and voided a paid run.
      - name: Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q -rs

      - name: Offline measurement
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/offline_demo.py --days 365

      # The evidence itself is checked against the code. The step above runs
      # the demo and compares its output to nothing; the step below compares
      # the README to the committed JSON. Neither compares the JSON to the
      # code, and without a step that does, a changed constant in
      # enclave/timeline.py moves every real figure while all of them stay
      # green: MISS_RATE["a CVE feed transfer"] 0.22 -> 0.50 moves the
      # published 53.7%/44.4% to 66.2%/56.8% and no other gate here notices.
      # tests/test_enclave.py::test_the_shipped_evidence_regenerates_byte_for_byte
      # asserts the same thing and is the gate that runs locally too. This one
      # exists as well because a diff PRINTS WHAT MOVED, which is what a
      # person looking at a red run needs, and because "regenerated and
      # diffed" is the form the README claims.
      - name: audit/offline.json still regenerates byte-for-byte
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/offline_demo.py --days 730 \
            --json "${RUNNER_TEMP}/offline.json" > /dev/null
          diff -u audit/offline.json "${RUNNER_TEMP}/offline.json"

      # A README is prose and drifts; audit/offline.json is evidence and does
      # not. This rebuilds each published figure from the JSON and requires the
      # exact string, so a re-run that shifts a number fails loudly rather than
      # leaving the document quietly wrong.
      - name: README numbers match the shipped results
        run: python scripts/check_readme_numbers.py
