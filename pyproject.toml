[project]
name = "airgapped-ai-bundle"
version = "0.1.0"
description = "When the network is removed, which failures are silent -- measured over a year inside the boundary"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "James Kelly" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
real = ["anthropic>=0.60", "openai>=1.40"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
